[pytest]
pythonpath = .
filterwarnings =
    # Third-party only: passlib 1.7.4 reads argon2.__version__ on import and the
    # deprecation is raised from passlib's own module. It cannot be fixed from
    # this project (passlib is unmaintained), so the ignore is scoped to this
    # single message/module instead of silencing warnings globally.
    ignore:Accessing argon2\.__version__ is deprecated:DeprecationWarning:passlib\.handlers\.argon2
