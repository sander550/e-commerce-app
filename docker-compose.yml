services:
  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma
    environment:
      CHROMA_DB_IMPL: "duckdb+parquet"
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_PORT: "8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/root/ollama-init.sh
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama serve & sleep 2 && /root/ollama-init.sh && tail -f /dev/null"
      ]
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      CHROMA_HOST: http://chroma:8000
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
      - postgres
      - ollama
      - chroma
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      CHROMA_HOST: http://chroma:8000
    command: python -m src.workers.email_worker
    depends_on:
      - redis
      - postgres
      - ollama
      - chroma
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  chroma_data: