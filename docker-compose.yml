services:
  postgres:
    image: pgvector/pgvector:pg15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/root/ollama-init.sh
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama serve & sleep 2 && /root/ollama-init.sh && tail -f /dev/null"
      ]
    restart: unless-stopped

  # Run database migrations before backend starts
  migration:
    build:
      context: .
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VECTOR_DIMENSIONS: "768"
      EMBEDDING_MODEL: bge-large
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c \"import psycopg2; psycopg2.connect(host='postgres', user='${POSTGRES_USER}', password='${POSTGRES_PASSWORD}', database='${POSTGRES_DB}')\" 2>/dev/null; do
          sleep 2
        done
        echo 'Postgres ready, running migrations...'
        alembic upgrade head
      "
    depends_on:
      - postgres
    restart: "no"

  backend:
    build:
      context: .
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
      - postgres
      - ollama
      - migration
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: python -m src.workers.worker
    depends_on:
      - redis
      - postgres
      - ollama
      - migration
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data: